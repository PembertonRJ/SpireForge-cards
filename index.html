function formulaTable(c) {
  const nt = c.cards.filter(x=>x.rarity!=='Token');
  const cnt = (k,v) => nt.filter(x=>x[k]===v).length;
  const rows = [
    ['Basic', cnt('rarity','Basic'), Math.round(F.rarity.Basic||4)],
    ['Common', cnt('rarity','Common'), Math.round(F.rarity.Common||20)],
    ['Uncommon', cnt('rarity','Uncommon'), Math.round(F.rarity.Uncommon||36)],
    ['Rare', cnt('rarity','Rare'), Math.round(F.rarity.Rare||26)],
    ['Attack', cnt('type','Attack'), Math.round(F.type.Attack)],
    ['Skill', cnt('type','Skill'), Math.round(F.type.Skill)],
    ['Power', cnt('type','Power'), Math.round(F.type.Power)],
    ['Exhaust', nt.filter(x=>x.exhaust).length, Math.round(F.exhaust)],
    ['X-cost', nt.filter(x=>x.xcost).length, Math.round(F.xcost)],
    ['Class relics', c.relics.length, F.classRelics],
  ];
  return `<table class="fx"><tr><th></th>${rows.map(r=>'<th>'+r[0]+'</th>').join('')}</tr>
    <tr><th>ours</th>${rows.map(r=>`<td class="${r[1]>=r[2]?'ok':'short'}">${r[1]}</td>`).join('')}</tr>
    <tr><th>vanilla formula</th>${rows.map(r=>'<td>'+r[2]+'</td>').join('')}</tr></table>`;
}

function charSection(c) {
  const nt = c.cards.filter(x=>x.rarity!=='Token');
  const artHave = c.cards.filter(x=>x.art).length;
  const deck = Object.entries(c.deckCounts).map(([k,v])=>`${v}× ${k}`).join(', ');
  const heroImg = c.refImg || c.designImg;
  return `
  <div class="hero" style="--cc:${c.color}">
    ${heroImg?`<div class="imgbox"><div class="animbox"><img src="${heroImg}"></div>
      <div class="imgcap">${c.refImg?'✅ LOCKED base':'⏳ pending approval'}</div></div>`:''}
    ${c.idle&&c.idle.src?`<div class="imgbox"><div style="background:#181b23;border-radius:10px;border:2px solid var(--cc,#2c3040);display:flex;align-items:flex-end;justify-content:center;padding:8px;min-height:210px">
      <div style="width:${c.idle.fw}px;height:${c.idle.fh}px;background-image:url('${c.idle.src}');background-size:${c.idle.sw}px ${c.idle.fh}px;image-rendering:pixelated;animation:sheetplay-${c.id} 1.6s steps(${c.idle.n}) infinite"></div>
      <style>@keyframes sheetplay-${c.id} { to { background-position-x: -${c.idle.sw}px; } }</style></div>
      <div class="imgcap">🕹️ Tier-2 in-game idle (${c.idle.n} frames, live)</div></div>`
      : c.combatImg?`<div class="imgbox"><div class="animbox" style="background:#181b23;display:flex;align-items:flex-end;justify-content:center;min-height:210px"><img src="${c.combatImg}" style="width:auto;max-width:100%;max-height:290px;image-rendering:pixelated"></div>
      <div class="imgcap">🕹️ in-game combat sprite · idle preview</div></div>`:''}
    ${c.actionImg?`<div class="imgbox"><img src="${c.actionImg}" style="width:210px;border-radius:10px;border:2px solid #2c3040"><div class="imgcap">action concept</div></div>`:''}
    <div class="info">
      <h2 style="color:${c.color}">${c.id}</h2>
      <div class="statline">${esc(c.desc)}</div>
      <span class="chip">❤️ ${c.hp} HP</span><span class="chip">skeleton: ${c.placeholder}</span>
      <span class="chip">starter relic: ${c.starterRelic}</span>
      <span class="chip">${c.combatScene?'✅ combat scene (animated)':'— no combat scene yet'}</span>
      <span class="chip">${c.frameArt?'✅ frames':'✗ frames'}</span><span class="chip">art ${artHave}/${c.cards.length}</span>
      <div class="statline" style="margin-top:6px">deck: ${deck}</div>
      ${formulaTable(c)}
    </div>
  </div>
  ${c.grid&&c.grid.src?`<h3>Combat animations <span class="note">(in-game frame data, live)</span></h3>
  <div style="display:flex;gap:14px;flex-wrap:wrap">${c.grid.rows.map((r,ri)=>{
    const g=c.grid, k=0.85, durs={idle:1.6,attack:0.45,cast:0.5,hit:0.3,die:0.8};
    const n=g.counts[r], dur=Math.max(durs[r]||0.5, 0.4);
    return `<div style="text-align:center">
      <div style="width:${g.fw*k}px;height:${g.fh*k}px;background:#181b23;border:2px solid var(--cc,#2c3040);border-radius:10px;background-image:url('${g.src}');background-size:${g.gw*k}px ${g.gh*k}px;background-position:0 -${ri*g.fh*k}px;image-rendering:pixelated;animation:ganim-${c.id}-${r} ${dur*2}s steps(${n}) infinite"></div>
      <style>@keyframes ganim-${c.id}-${r} { to { background-position-x: -${n*g.fw*k}px; } }</style>
      <div class="imgcap">${r}</div></div>`;}).join('')}
  </div>`:''}
  <h3>Cards — ${c.cards.length} (${nt.length} pool + ${c.cards.length-nt.length} token)</h3>
  <div class="grid" style="--cc:${c.color}">${c.cards.map((x,xi)=>`
    <div class="card" style="--rc:${RC[x.rarity]}" data-ci="${DATA.chars.indexOf(c)}" data-xi="${xi}">
      ${x.art?`<img class="thumb" src="${x.artPath}">`:''}
      <div class="top"><div class="cost">${x.xcost?'X':x.cost}</div><div class="nm">${esc(x.title)}</div></div>
      <div class="meta">${x.rarity} · ${x.type} · ${x.target}</div>
      <div class="txt">${esc(x.text)}</div>
      ${x.upgrade?`<div class="upg">⬆ ${x.upgrade}</div>`:''}
      <div class="badges">
        ${x.xcost?'<span class="b x">X-cost</span>':''}${x.exhaust?'<span class="b">Exhaust</span>':''}
        ${x.scales?'<span class="b">~scales</span>':''}<span class="b ${x.art?'art':'noart'}">${x.art?'art ✓':'art —'}</span>
      </div>
    </div>`).join('')}
  </div>
  <h3>Powers — ${c.powers.length}</h3>
  <div class="rlist">${c.powers.map(r=>`<div class="relic"><span class="nm">${esc(r.title)}</span> <span class="rr">(${r.cls})</span><div class="txt">${esc(r.text)}</div></div>`).join('')}</div>
  <h3>Relics — ${c.relics.length} / ${F.classRelics}</h3>
  <div class="rlist">${c.relics.map(r=>`<div class="relic"><span class="nm" style="color:${RC[r.rarity]||'#fff'}">${esc(r.title)}</span> <span class="rr">${r.rarity}</span><div class="txt">${esc(r.text)}</div><div class="fl">${esc(r.flavor)}</div></div>`).join('')}</div>
  <h3>Potions — ${c.potions.length} <span class="note">(vanilla: 0 class potions — ours are a bonus)</span></h3>
  <div class="rlist">${c.potions.map(r=>`<div class="relic"><span class="nm">${esc(r.title)}</span> <span class="rr">${r.rarity}</span><div class="txt">${esc(r.text)}</div></div>`).join('')}</div>`;
}

function vanillaSection(v) {
  const s = v.stats;
  const chips = s ? `<span class="chip">rarity: ${Object.entries(s.rarity).map(([k,n])=>k[0]+':'+n).join(' · ')}</span>
    <span class="chip">type: ${Object.entries(s.type).map(([k,n])=>k[0]+':'+n).join(' · ')}</span>
    <span class="chip">Exhaust: ${s.exhaust}</span><span class="chip">X-cost: ${s.xcost}</span>` : '';
  return `
  <div class="hero" style="--cc:${v.color}">
    ${v.img?`<div class="imgbox"><div class="animbox"><img src="${v.img}"></div><div class="imgcap">vanilla</div></div>`:''}
    <div class="info">
      <h2 style="color:${v.color}">${v.id} <span style="font-size:13px;color:#8b90a0">(vanilla baseline)</span></h2>
      <span class="chip">❤️ ${v.hp} HP</span><span class="chip">pool: ${v.cardList.length} cards</span>
      <span class="chip">${v.relicList.length} class relics</span><span class="chip">potions: shared pool (45)</span>
      <div style="margin-top:6px">${chips}</div>
    </div>
  </div>
  <h3>Card pool — ${v.cardList.length}</h3><div class="vlist">${v.cardList.map(x=>'<div>'+x+'</div>').join('')}</div>
  <h3>Class relics — ${v.relicList.length}</h3><div class="vlist" style="columns:2">${v.relicList.map(x=>'<div>'+x+'</div>').join('')}</div>`;
}

const tabs = document.getElementById('tabs'), main = document.getElementById('main');
const all = [...DATA.chars, ...DATA.vanillas];
all.forEach((c, i) => {
  const b = document.createElement('button');
  b.className = 'tab' + (c.vanilla ? ' v' : ''); b.style.setProperty('--cc', c.color);
  b.textContent = c.id; b.onclick = () => select(i); tabs.appendChild(b);
  const s = document.createElement('section');
  s.innerHTML = c.vanilla ? vanillaSection(c) : charSection(c);
  main.appendChild(s);
});
function select(i) {
  [...tabs.children].forEach((b,j)=>b.classList.toggle('active', i===j));
  [...main.children].forEach((s,j)=>s.classList.toggle('active', i===j));
}
select(0);
